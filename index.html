<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitch Chat</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
        {
          "imports": {
            "tmi.js": "https://cdn.jsdelivr.net/npm/tmi.js@1.8.5/esm/index.js"
          }
        }
    </script>
</head>
<body>
    <div id="app">
        <div id="connection-panel">
            <h2>Connect to Twitch Chat</h2>
            <input type="text" id="channel-input" placeholder="Enter Twitch channel name">
            <button id="connect-button">Connect</button>
            <p id="connection-status">Status: Disconnected</p>
            <p style="font-size: 0.8em; color: #888;">(Check browser console for logs)</p>
        </div>
        <div id="chat-container">
            <div id="chat-messages"></div>
            <input type="text" id="message-input" placeholder="Send a message (requires login - not implemented)" disabled>
            <button id="send-button" disabled>Send</button>
        </div>
        <div id="user-list-container">
            <h2>Users in Chat</h2>
            <ul id="user-list"></ul>
        </div>
        <div id="user-profile-modal" class="modal">
            <div class="modal-content">
                <span class="close-button">&times;</span>
                <h3 id="profile-username"></h3>
                <h4>Chat History:</h4>
                <ul id="profile-chat-history"></ul>
            </div>
        </div>
    </div>

    <script type="module" src="config.js"></script>
    <script type="module" src="app.js"></script>

</body>
</html>
